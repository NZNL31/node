name: Update Candidates

# 这个工作流只做「供给聚合」：拉订阅源 → 解析 → 完整性清理 → 去重 → 提交候选池。
# 探活与发布不在这里做 —— 「能不能连」的结论取决于从哪台机器测，由运行方自己的
# 服务器（run.sh）负责，它才是唯一写入订阅的进程。

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-candidates
  cancel-in-progress: false

jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 签出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 回归测试
        run: |
          python test_parse.py
          python test_top.py
          python test_health.py

      - name: 拉取并解析订阅
        env:
          MIN_NODES: 50          # 少于这个数说明订阅源集体失效，直接失败
          SOURCE_LIMIT: 1200     # 单个源最多收 1200 个（巨型 dump 兜底）
        run: python fetch_subscriptions.py

      - name: 生成候选池
        run: |
          cp all_nodes.yaml candidates.yaml
          python - <<'PY'
          import sys
          import yaml

          doc = yaml.safe_load(open("candidates.yaml", encoding="utf-8"))
          nodes = doc.get("proxies") or []
          if not nodes:
              sys.exit("候选池为空")
          names = {n["name"] for n in nodes}
          if len(names) != len(nodes):
              sys.exit("候选池里有重名节点（客户端会互相覆盖）")
          import collections
          dist = collections.Counter(n["type"] for n in nodes)
          print(f"候选池 {len(nodes)} 个节点: {dict(dist)}")
          # 假 IP / 保留地址不该出现在候选池里
          import ipaddress
          bad = []
          for n in nodes:
              try:
                  ip = ipaddress.ip_address(str(n["server"]).strip("[]"))
              except ValueError:
                  continue
              if ip.is_private or ip.is_loopback or ip.is_reserved or ip.is_link_local:
                  bad.append(n["server"])
          if bad:
              sys.exit(f"候选池里出现了内网/保留地址: {bad[:3]}")
          print("校验通过")
          PY

      # GitHub 的 schedule 是 best-effort：实测小时级 cron 一次都没触发，每 3 小时那个
      # 任务一天也只跑 4 次（间隔 9 小时）。所以把香港探测并进这个至少会被触发的任务里，
      # 每次 50 个 —— 不依赖 hk.yml 能否按时醒来。
      - name: 香港探测（并入候选池任务）
        env:
          HK_NODES: hk1.node.check-host.net,jp1.node.check-host.net
          HK_BATCH: 50
          HK_TTL_H: 96
          HK_PRUNE_DAYS: 30
          HK_COLLECT_SECONDS: 300
        run: python hk_probe.py || echo "[警告] 香港探测失败，继续"

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

          git add candidates.yaml hk_latency.json
          if git diff --cached --quiet; then
            echo "候选池没有变化，跳过提交"
            exit 0
          fi

          for i in 1 2 3 4; do
            git add candidates.yaml hk_latency.json
            git commit -q -m "chore: 更新候选池 $(date -u '+%Y-%m-%d %H:%M UTC')" || true
            if git push -q origin HEAD:main; then
              echo "推送成功（第 $i 次尝试）"
              exit 0
            fi
            echo "推送失败，同步远端后重试（$i/4）…"
            git fetch -q origin main --depth=1 || true
            # 只回退索引，工作区的候选池保持本次生成的内容
            git reset -q --mixed FETCH_HEAD || true
            sleep 5
          done

          echo "推送连续失败，请手动重跑" >&2
          exit 1
