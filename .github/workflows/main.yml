name: Update Subscriptions

on:
  schedule:
    - cron: "0 */3 * * *"   # 每 3 小时
  workflow_dispatch:

permissions:
  contents: write

# 定时和手动触发撞车时排队执行，不要互相取消（取消会留下半套产物）
concurrency:
  group: update-subscriptions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 签出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # sing-box 用来做真实测速：起一个本地代理，逐个节点走真实链路测延迟。
      # 它同时提供 Clash 兼容的 clash_api（/proxies/{name}/delay），所以探活逻辑
      # 和用 mihomo 时完全一样，只是内核换了、顺便少维护一个二进制。
      - name: 下载 sing-box
        env:
          SINGBOX_VERSION: 1.14.4
        run: |
          curl -fL --retry 3 -o sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          tar -xzf sing-box.tar.gz
          mv "sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box" .
          chmod +x sing-box
          ./sing-box version

      # 淘汰逻辑的回归测试（纯计算，不联网，毫秒级）。这条挂了就别发布。
      - name: 回归测试
        run: python test_health.py

      - name: 拉取并解析订阅
        env:
          MIN_NODES: 50          # 少于这个数说明订阅源集体失效，直接失败
        run: python fetch_subscriptions.py
      # check-host.net 的香港探测点有速率限制（实测连发约 50 次开始返回
      # limit_exceeded），所以每轮只测一小批，结果累积在 hk_latency.json 里，
      # 几轮覆盖全量。这一步失败不影响发布。
      - name: 香港探测点测延迟
        env:
          HK_BATCH: 30           # 每轮最多测多少个
          HK_TTL_H: 96           # 结果缓存 4 天
          HK_PRUNE_DAYS: 30      # 已不在池里的条目再留 30 天
        run: python hk_probe.py

      - name: 真实测速
        env:
          MAX_PROBE: 2500
          PROBE_CONCURRENCY: 32
          # 测速只用于排序和打标记，不用于淘汰节点（原因见 speed_test.py 文件头）
          MAX_OUTPUT: 1500
          HK_TTL_H: 96           # 与 hk_probe.py 保持一致：过期数据不参与排序
          FEATURED_SIZE: 30      # 🚀 精选组大小
        run: python speed_test.py

      # 产物自检：宁可这次不更新，也不要发布一份坏配置
      - name: 校验产物
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import sys
          import yaml

          doc = yaml.safe_load(open("clash.yaml", encoding="utf-8"))
          proxies = doc.get("proxies") or []
          groups = doc.get("proxy-groups") or []
          if not proxies:
              sys.exit("clash.yaml 里没有节点")

          names = {p["name"] for p in proxies}
          group_names = {g["name"] for g in groups}
          dangling = [n for g in groups for n in g["proxies"]
                      if n not in names | group_names]
          if dangling:
              sys.exit(f"代理组里有悬空引用: {dangling[:3]}")

          raw = base64.b64decode(open("v2.txt", encoding="utf-8").read()).decode()
          uris = [l for l in raw.splitlines() if "://" in l]
          if len(uris) != len(proxies):
              sys.exit(f"v2.txt 有 {len(uris)} 条，clash.yaml 有 {len(proxies)} 个节点，不一致")

          # singbox.json：sing-box 表达不了的节点（xhttp 传输、SSR）不会进去，
          # 所以它的节点数只会比 clash.yaml 少一点，不会多，也不能少太多。
          sb = json.load(open("singbox.json", encoding="utf-8"))
          sb_outs = sb.get("outbounds") or []
          node_outs = [o for o in sb_outs if o.get("type") not in
                       ("selector", "urltest", "direct", "block")]
          tags = {o["tag"] for o in sb_outs}
          if len(tags) != len(sb_outs):
              sys.exit("singbox.json 里有重复的 outbound tag")
          dangling_sb = [t for g in sb_outs
                         if g.get("outbounds")
                         for t in g["outbounds"] if t not in tags]
          if dangling_sb:
              sys.exit(f"singbox.json 的组里有悬空引用: {dangling_sb[:3]}")
          if not (0.85 * len(proxies) <= len(node_outs) <= len(proxies)):
              sys.exit(f"singbox.json 节点数异常: {len(node_outs)} vs clash.yaml {len(proxies)}")

          # 香港延迟缓存是可选的，但既然要提交，格式必须是对的
          if os.path.exists("hk_latency.json"):
              hk = json.load(open("hk_latency.json", encoding="utf-8"))
              entries = hk.get("nodes") or {}
              bad = [k for k, v in entries.items()
                     if not isinstance(v, dict) or "ms" not in v]
              if bad:
                  sys.exit(f"hk_latency.json 有 {len(bad)} 条格式不对: {bad[:3]}")
              print(f"香港缓存 {len(entries)} 条")

          # 连续失败计数：丢了它就等于所有淘汰状态清零，节点会集体复活
          if os.path.exists("node_health.json"):
              nh = json.load(open("node_health.json", encoding="utf-8"))
              entries = nh.get("nodes") or {}
              bad = [k for k, v in entries.items()
                     if not isinstance(v, dict) or "fails" not in v]
              if bad:
                  sys.exit(f"node_health.json 有 {len(bad)} 条格式不对: {bad[:3]}")
              print(f"健康记录 {len(entries)} 条")

          print(f"校验通过: {len(proxies)} 个 Clash 节点, {len(uris)} 条 URI, "
                f"{len(node_outs)} 个 sing-box outbound")
          PY

      # 上面的自检只看结构（悬空引用、条数一致性）。真正决定「客户端能不能加载」
      # 的是代理内核自己：规则写错、组类型不对、字段类型不对，在客户端上就是
      # 整个订阅加载失败。这里用 CI 里已经下好的同一个版本过一遍。
      - name: 用 sing-box 校验最终配置
        run: ./sing-box check -c singbox.json

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

          git add clash.yaml v2.txt singbox.json
          git add hk_latency.json node_health.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi

          for i in 1 2 3 4; do
            git add clash.yaml v2.txt singbox.json
            git add hk_latency.json node_health.json 2>/dev/null || true
            git commit -m "chore: 更新订阅 $(date -u '+%Y-%m-%d %H:%M UTC')" || true
            if git push origin HEAD:main; then
              echo "推送成功（第 $i 次尝试）"
              exit 0
            fi

            echo "推送失败，同步远端后重试（$i/4）…"
            git fetch origin main --depth=1 || true
            # 不要用 rebase：clash.yaml / v2.txt 是每次重新生成的产物，和远端
            # 必然冲突，rebase 会直接把整个任务搞挂（踩过一次）。
            # reset --mixed 把索引换成远端最新，工作区的产物保持不动，
            # 下一轮 add 时以本次生成的结果为准，其余文件跟远端走。
            git reset --mixed FETCH_HEAD || true
            sleep 5
          done

          echo "推送连续失败，请手动重跑" >&2
          exit 1
