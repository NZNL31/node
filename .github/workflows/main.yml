name: Update Subscriptions

on:
  schedule:
    - cron: "0 */3 * * *"   # 每 3 小时
  workflow_dispatch:

permissions:
  contents: write

# 定时和手动触发撞车时排队执行，不要互相取消（取消会留下半套产物）
concurrency:
  group: update-subscriptions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 签出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      # mihomo 用来做真实测速：起一个本地代理，逐个节点走真实链路测延迟。
      # compatible 版本不依赖 AVX 指令集，兼容性最好。
      - name: 下载 mihomo
        env:
          MIHOMO_VERSION: v1.19.33
        run: |
          curl -fL --retry 3 -o mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-compatible-${MIHOMO_VERSION}.gz"
          gunzip -f mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: 拉取并解析订阅
        env:
          MIN_NODES: 50          # 少于这个数说明订阅源集体失效，直接失败
        run: python fetch_subscriptions.py

      # check-host.net 的香港探测点有速率限制（实测连发约 50 次开始返回
      # limit_exceeded），所以每轮只测一小批，结果累积在 hk_latency.json 里，
      # 几轮覆盖全量。这一步失败不影响发布。
      - name: 香港探测点测延迟
        env:
          HK_BATCH: 30           # 每轮最多测多少个
          HK_TTL_H: 96           # 结果缓存 4 天
        run: python hk_probe.py

      - name: 真实测速
        env:
          MAX_PROBE: 1500
          PROBE_CONCURRENCY: 32
          # 测速只用于排序和打标记，不用于淘汰节点（原因见 speed_test.py 文件头）
          MAX_OUTPUT: 1000
        run: python speed_test.py

      # 产物自检：宁可这次不更新，也不要发布一份坏配置
      - name: 校验产物
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import sys
          import yaml

          doc = yaml.safe_load(open("clash.yaml", encoding="utf-8"))
          proxies = doc.get("proxies") or []
          groups = doc.get("proxy-groups") or []
          if not proxies:
              sys.exit("clash.yaml 里没有节点")

          names = {p["name"] for p in proxies}
          group_names = {g["name"] for g in groups}
          dangling = [n for g in groups for n in g["proxies"]
                      if n not in names | group_names]
          if dangling:
              sys.exit(f"代理组里有悬空引用: {dangling[:3]}")

          raw = base64.b64decode(open("v2.txt", encoding="utf-8").read()).decode()
          uris = [l for l in raw.splitlines() if "://" in l]
          if len(uris) != len(proxies):
              sys.exit(f"v2.txt 有 {len(uris)} 条，clash.yaml 有 {len(proxies)} 个节点，不一致")

          # 香港延迟缓存是可选的，但既然要提交，格式必须是对的
          if os.path.exists("hk_latency.json"):
              hk = json.load(open("hk_latency.json", encoding="utf-8"))
              entries = hk.get("nodes") or {}
              bad = [k for k, v in entries.items()
                     if not isinstance(v, dict) or "ms" not in v]
              if bad:
                  sys.exit(f"hk_latency.json 有 {len(bad)} 条格式不对: {bad[:3]}")
              print(f"香港缓存 {len(entries)} 条")

          print(f"校验通过: {len(proxies)} 个节点, {len(uris)} 条 URI")
          PY

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

          git add clash.yaml v2.txt
          git add hk_latency.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi

          for i in 1 2 3 4; do
            git add clash.yaml v2.txt
            git add hk_latency.json 2>/dev/null || true
            git commit -m "chore: 更新订阅 $(date -u '+%Y-%m-%d %H:%M UTC')" || true
            if git push origin HEAD:main; then
              echo "推送成功（第 $i 次尝试）"
              exit 0
            fi

            echo "推送失败，同步远端后重试（$i/4）…"
            git fetch origin main --depth=1 || true
            # 不要用 rebase：clash.yaml / v2.txt 是每次重新生成的产物，和远端
            # 必然冲突，rebase 会直接把整个任务搞挂（踩过一次）。
            # reset --mixed 把索引换成远端最新，工作区的产物保持不动，
            # 下一轮 add 时以本次生成的结果为准，其余文件跟远端走。
            git reset --mixed FETCH_HEAD || true
            sleep 5
          done

          echo "推送连续失败，请手动重跑" >&2
          exit 1
